# The tasks of physlibAlpha-worker (scripts/worker/physlibAlpha_worker.py).
#
# Each task is the skill in .agents/skills/<task>/SKILL.md, whose text after its frontmatter is the
# prompt given to the agent. Only the skills listed here are tasks of the worker, and the worker
# reads this file and the skills from upstream master (or from a checkout, with --tasks-from).

# The task run when none is named.
default = "physlibalpha-next-step"

# For each task, the title of its PR. It is written here, by a human, never by the AI.
# A task with `input = true` must be given an input, `<task> "<input>"`, which the worker puts
# before the skill's text in the prompt, as the input `X`.

[tasks.physlibalpha-next-step]
title = "feat(PhyslibAlpha): add a definition expanding PhyslibAlpha"

[tasks.physlibalpha-align-with-handbook]
title = "refactor(PhyslibAlpha): tidy a PhyslibAlpha file"

[tasks.physlibalpha-add]
title = "feat(PhyslibAlpha): add a given result to PhyslibAlpha"
input = true
