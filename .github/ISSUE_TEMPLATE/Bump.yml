name: Bump Issue
description: Issue used to bump the version of a Lean.
title: "Bump to version: "
body:
- type: textarea
  id: bump_details
  attributes:
    label: Version bump
    description: Please do not modify this text.
    value: |
      This issue is a tracker issue for bumping Physlib to new versions of Lean.
      The checklist below should be used to ensure that the bump is done correctly.
  validations:
    required: true
- type: checkboxes
  id: basics
  attributes:
    label: Basics
    description: Please check off these items as you complete them
    options:
      - label: Update mathlib rev in lakefile.toml.
      - label: Update doc-gen4 rev in docs/build/lakefile.toml.
      - label: Remove the `.lake` file, e.g. on unix run `rm -rf .lake`.
      - label: Run `lake update`.
      - label: In `docs/build/`, run `MATHLIB_NO_CACHE_ON_UPDATE=1 lake update doc-gen4 Physlib`.
      - label: Check `lean-toolchain` updates correctly.
      - label: Update the Lean version badge in the `README.md` file.
  validations:
    required: false
- type: checkboxes
  id: build
  attributes:
    label: Build
    description: Please check off these items as you complete them
    options:
      - label: Run `lake build` and fix any errors.
  validations:
    required: false
- type: checkboxes
  id: scripts
  attributes:
    label: Scripts
    description: Please check off these items as you complete them
    options:
      - label: Ensure `lake exe lint_all` runs without errors.
      - label: Ensure `lake exe auxillary_script_test` runs without errors (this runs `TODO_to_yml`, `stats`, `informal` and `make_tag`, and leaves no files behind).
  validations:
    required: false
- type: checkboxes
  id: afterwords
  attributes:
    label: Afterwards
    description: Please check off these items as you complete them
    options:
      - label: Create a tag for the new version.
      - label: Put a bump notice on this [thread](https://leanprover.zulipchat.com/#narrow/channel/479953-Physlib/topic/Bumps.20of.20PhysLean.2E/with/572707099).
  validations:
    required: false
- type: textarea
  id: examples_of_previous_bumps
  attributes:
    label: Example past bumps
    description: Please do not modify this text.
    value: |
      [v4.20.0](https://github.com/leanprover-community/physlib/pull/591),
      [v4.20.0-rc5](https://github.com/leanprover-community/physlib/pull/566)
      [v4.27.0](https://github.com/leanprover-community/physlib/pull/929)
  validations:
    required: true
