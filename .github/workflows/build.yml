
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Style linters

jobs:
  doc_lint:
    name: Lean based style linters
    runs-on: ubuntu-latest
    env:
      LAKE_CACHE_DIR: .lake/cache
    steps:

      # Need the full history here, lake looks back through the commits to find
      # one with a cache. A shallow clone only has one so it never finds anything.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: check versions
        run: |
          lean --version
          lake --version

      - name: Mathlib build cache
        run: |
          lake exe cache get

      # Pulls the cache from the bucket so we only compile what the PR changed.
      # No key needed as it is only reading. If it fails we just build from scratch.
      - name: Physlib's build cache
        env:
          LAKE_CONFIG: ${{ github.workspace }}/lake-cache.toml
        run: |
          lake cache get --scope="physlib-master/$(tr '/:' '--' < lean-toolchain | tr -d '[:space:]')/physlib" \
            || echo "no existing cache to restore -- building from scratch"

      - name: build Physlib
        id: build
        uses: liskin/gh-problem-matcher-wrap@e7b7beaaafa52524748b31a381160759d68d61fb # v3
        with:
          linters: gcc
          run: |
            bash -o pipefail -c "env LEAN_ABORT_ON_PANIC=1 lake build -KCI | tee stdout.log"

      - name: check file imports
        run: |
          bash -o pipefail -c "env LEAN_ABORT_ON_PANIC=1 lake exe check_file_imports"

      - name: check for duplicate TODO tags
        run: |
          bash -o pipefail -c "env LEAN_ABORT_ON_PANIC=1 lake exe check_dup_tags"

      - name: sorryful and psuedo attribute linter
        run: |
          bash -o pipefail -c "env LEAN_ABORT_ON_PANIC=1 lake exe sorry_lint"

      - name: runLinter on Physlib
        if: ${{ always() && steps.build.outcome == 'success' || steps.build.outcome == 'failure' }}
        id: lint
        uses: liskin/gh-problem-matcher-wrap@e7b7beaaafa52524748b31a381160759d68d61fb # v3
        timeout-minutes: 4
        with:
          linters: gcc
          run: env LEAN_ABORT_ON_PANIC=1 lake exe runPhyslibLinters

  style_lint:
    name: Python based style linter
    runs-on: ubuntu-latest
    steps:
      - name: cleanup
        run: |
          find . -name . -o -prune -exec rm -rf -- {} +

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Run the case checker action
      - name: Check Case Sensitivity
        uses: credfeto/action-case-checker@cb652aeab29ed363bbdb7d9ee1bfcc010c46cac5 # v1.3.0

      - name: Look for ignored files
        uses: credfeto/action-no-ignored-files@0c61dc01fd498dd8fa6786f21062be4fd158c8b1 # v1.1.0

      - name: install Python
        if: ${{ 'ubuntu-latest' == 'ubuntu-latest' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.8

      - name: lint
        run: |
          chmod u+x scripts/lint-style.sh
          ./scripts/lint-style.sh

      - name: Check API maps
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/api_map_linter.py --repo .

  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2
        with:
          exclude_file: scripts/MetaPrograms/spellingWords.txt,scripts/physlibNoShake.json
          ignore_words_file: .codespellignore
