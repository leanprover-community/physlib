name: PR Comment

# Leaves a comment on a new pull-request, made of two collapsible sections:
#
# - "Information about what will happen to your PR", the fixed text of `.github/PRMessage.md`;
# - "Summary of your PR for reviewers", made by `lake exe pr_summary`, which substitutes the
#   `<!-- PR_SUMMARY -->` marker of that file.
#
# Every push to the pull-request remakes the comment, so that the summary is of the commits which
# are now there. The comment left by the previous run is updated in place rather than replaced by
# a second one: it is found by the `<!-- physlib-pr-summary -->` marker which is the first line of
# `.github/PRMessage.md`.
#
# `pr_summary` is built from `master`, and only reads the diff of the branch of the pull-request,
# so no code of the pull-request is run.
#
# The tests of `pr_summary` are `#guard_msgs` commands in its source, so building it runs them.
# The `test` job below does that whenever the script changes.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull-request to comment on
        required: true
        type: string
  pull_request_target:
    # `synchronize` is a push to the branch of the pull-request, which is what makes the summary
    # of the previous run out of date.
    types: [opened, synchronize]
  push:
    paths:
      - scripts/alpha/github/pr_summary.lean
      - .github/workflows/PRMessage.yml
  pull_request:
    paths:
      - scripts/alpha/github/pr_summary.lean
      - .github/workflows/PRMessage.yml

# A push which lands while the summary of the previous one is still being made cancels it, so
# that the comment ends up holding the summary of the last commit and not of an earlier one.
# The event is part of the group because a pull-request which changes the script triggers both
# `pull_request` and `pull_request_target`, and those two runs must not cancel each other.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

# Limit permissions for GITHUB_TOKEN for the entire workflow
permissions:
  contents: read
  pull-requests: write  # Only allow PR comments
  # All other permissions are implicitly 'none'

jobs:
  test:
    name: Test pr_summary
    # The pull-request which changes the script, not the one to comment on.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The whole history, so that the smoke test below has something to diff.
          fetch-depth: 0

      - name: Configure Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      # The `#guard_msgs` tests of the script run as it is compiled, so this fails if one of
      # them fails.
      - name: Build pr_summary and run its tests
        run: lake build pr_summary

      - name: Summarise the last commit
        run: ./.lake/build/bin/pr_summary HEAD~1 HEAD

  comment:
    name: Comment a pull_request
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Find the pull-request to comment on
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The number comes from the event for a pull-request, and from the input for a
          # manual run.
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" \
            --json number,baseRefOid,headRefOid \
            --jq '"number=\(.number)\nbase=\(.baseRefOid)\nhead=\(.headRefOid)"' \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Checkout master to build pr_summary from
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          path: tools

      - name: Configure Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: tools # Building here

      - name: Build pr_summary from master
        working-directory: tools
        run: lake build pr_summary

      - name: Checkout the branch of the pull-request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.head }}
          # The whole history, so that the base of the pull-request is there to diff against.
          fetch-depth: 0
          path: pr-branch
          # Untrusted (potentially fork) checkout: don't persist the GITHUB_TOKEN into its
          # .git/config.
          persist-credentials: false
          # pr_summary is built from the trusted base checkout and only reads the diff of this
          # one, so checking out fork PR code under pull_request_target is safe.
          allow-unsafe-pr-checkout: true

      - name: Summarise the pull-request
        working-directory: pr-branch
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          summary="${RUNNER_TEMP}/summary.md"
          if ! "${GITHUB_WORKSPACE}/tools/.lake/build/bin/pr_summary" \
                 "${BASE}" "${HEAD}" > "${summary}"
          then
            # A comment with no summary is still worth posting.
            printf '*The summary of this PR could not be made; see the logs of this workflow.*\n' \
              > "${summary}"
          fi
          # The comment is remade on every push, so say which commit this summary is of.
          printf '\n*Summary of commit `%s`, remade whenever a commit is pushed.*\n' \
            "${HEAD:0:7}" >> "${summary}"
          cat "${summary}"

      - name: Assemble the comment
        run: |
          awk -v summary="${RUNNER_TEMP}/summary.md" '
            $0 == "<!-- PR_SUMMARY -->" {
              while ((getline line < summary) > 0) print line
              next
            }
            { print }' tools/.github/PRMessage.md > "${RUNNER_TEMP}/comment.md"
          cat "${RUNNER_TEMP}/comment.md"

      - name: Comment a pull_request, or update the comment of the previous run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          # The first line of `.github/PRMessage.md`, and so of the comment this workflow leaves.
          MARKER: <!-- physlib-pr-summary -->
        run: |
          # The comments are fetched in a step of their own, so that `set -e` stops here if the
          # API call fails: an empty answer would otherwise read as "no comment yet" and leave a
          # second one.
          comments="${RUNNER_TEMP}/comments.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" > "${comments}"
          # Only a comment of the Actions bot is updated, so a comment which somebody else
          # happened to open with the marker is left alone. The oldest match wins, so that a
          # comment which was somehow left twice does not leave the two taking turns.
          id=$(jq -r --arg marker "${MARKER}" \
            '.[] | select(.user.login == "github-actions[bot]")
                 | select(.body | startswith($marker)) | .id' "${comments}" | head -1)
          if [ -n "${id}" ]
          then
            printf 'Updating comment %s.\n' "${id}"
            jq -Rs '{body: .}' "${RUNNER_TEMP}/comment.md" > "${RUNNER_TEMP}/comment.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              --input "${RUNNER_TEMP}/comment.json"
          else
            printf 'No comment of this workflow to update; leaving a new one.\n'
            gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/comment.md"
          fi
