name = "Physlib"

# These settings allow `lake cache` to work
# `enableArtifactCache` allows the workflow to update the cache
# `restoreAllArtifacts` allows the cached artifacts to be used in `lake build`
enableArtifactCache = true
restoreAllArtifacts = true

defaultTargets = ["Physlib", "QuantumInfo"]

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.34.1"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "Physlib"
moreLeanArgs = ["-Dwarn.sorry=false", "-Dweak.says.verify=true"]

[[lean_lib]]
name = "PhyslibAlpha"
moreLeanArgs = ["-Dwarn.sorry=false", "-Dweak.says.verify=true"]

[[lean_lib]]
name = "QuantumInfo"
moreLeanArgs = ["-Dwarn.sorry=false", "-Dweak.says.verify=true"]

[[lean_exe]]
name = "get_cache"
srcDir = "scripts/dev"

[[lean_exe]]
name = "check_file_imports"
srcDir = "scripts/lint/required"

[[lean_exe]]
name = "autolabel"
srcDir = "scripts/github"

[[lean_exe]]
name = "style_lint"
srcDir = "scripts/lint/optional"

[[lean_exe]]
name = "type_former_lint"
srcDir = "scripts/lint/optional"

[[lean_exe]]
name = "lint_all"
srcDir = "scripts/lint/required"
supportInterpreter = true

[[lean_exe]]
name = "check_dup_tags"
srcDir = "scripts/lint/required"
supportInterpreter = true

[[lean_exe]]
