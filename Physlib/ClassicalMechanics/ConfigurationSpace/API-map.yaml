version: v0.1

Title: Configuration Space

Overview: |
  The configuration space `M` of a mechanical system is the manifold of its configurations;
  its charts are generalised coordinates. Lagrangians are functions on its tangent bundle `TM`.

ParentAPIs: []

References:
  - Ivo Terek, Introductory Variational Calculus on Manifolds
  - V. I. Arnold, Mathematical Methods of Classical Mechanics
  - L. D. Landau and E. M. Lifshitz, Mechanics

Requirements:
  - description: >
      A general, system-agnostic `ConfigurationSpace` construction (a configuration manifold
      abstracting over the choice of mechanical system) usable across the Lagrangian API.
    done: true
    location: "Physlib/ClassicalMechanics/ConfigurationSpace/Basic.lean (ConfigurationSpace)"

  - description: >
      The API shall prove that, in global generalised coordinates, a curve is smooth if and
      only if its coordinate curve is, with velocity the time derivative of the coordinate
      curve.
    done: false
    location: N/A

  - description: >
      The configuration spaces of the harmonic oscillator and the simple pendulum shall be
      configuration spaces of this API.
    done: false
    location: N/A
