version: v0.1

Title: Lagrangian mechanics

Overview: |
  A Lagrangian system on a smooth manifold `M` is a smooth function on time and the
  tangent bundle `TM` of positions and velocities. Its motions are the critical points of
  the action under smooth variations fixing the endpoints.

ParentAPIs:
  - Configuration Space (Physlib/ClassicalMechanics/ConfigurationSpace)
  - Time (Physlib/SpaceAndTime/Time)

References:
  - Ivo Terek, Introductory Variational Calculus on Manifolds
  - V. I. Arnold, Mathematical Methods of Classical Mechanics
  - L. D. Landau and E. M. Lifshitz, Mechanics

Requirements:
  - description: >
      The API defines a smooth time-dependent Lagrangian `Time × TM → ℝ` on a smooth
      manifold `M`.
    done: true
    location: "Physlib/ClassicalMechanics/Lagrangian/Basic.lean (LagrangianSystem)"

  - description: >
      The API contains smooth variations of a curve fixing its endpoints, the action, and its
      critical points.
    done: true
    location: "Physlib/ClassicalMechanics/Lagrangian/Basic.lean (LagrangianSystem.action, LagrangianSystem.IsCriticalPoint); Physlib/ClassicalMechanics/ConfigurationSpace/Variation.lean (Variation)"

  - description: >
      The API shall express the action of a Lagrangian system on a normed space as the
      integral of `L(t, q, q̇)` along the coordinate curve.
    done: true
    location: "Physlib/ClassicalMechanics/Lagrangian/NormedSpace.lean (LagrangianSystem.action_ofNormedSpace)"

  - description: >
      The API shall prove that, on a normed space, a smooth curve is a critical point of the
      action over a non-degenerate interval if and only if the Euler-Lagrange equations hold.
    done: true
    location: "Physlib/ClassicalMechanics/Lagrangian/EulerLagrange.lean (LagrangianSystem.isCriticalPoint_ofNormedSpace_iff)"

  - description: >
      The API shall prove that a critical point of the action satisfies the Euler-Lagrange
      equations in every chart containing it.
    done: true
    location: "Physlib/ClassicalMechanics/Lagrangian/EulerLagrangeChart.lean (LagrangianSystem.eulerLagrange_chartLagrangian_of_isCriticalPoint)"

  - description: >
      The API shall prove that a smooth curve satisfying the Euler-Lagrange equations in every
      chart is a critical point of the action (the converse on a general configuration space).
    done: false
    location: N/A

  - description: >
      The API shall prove Noether's theorem: if an autonomous Lagrangian system admits a
      one-parameter group of diffeomorphisms of `M`, then its Lagrange equations have a first
      integral.
    done: false
    location: N/A

  - description: >
      The API shall prove that the energy of an autonomous Lagrangian system is constant along
      its motions.
    done: false
    location: N/A

  - description: >
      The API shall define natural systems, with Lagrangian kinetic minus potential energy from
      a Riemannian metric.
    done: false
    location: N/A

  - description: >
      The API shall define Lagrangians `L(q, q̇, t)` in generalised coordinates as Lagrangian
      systems.
    done: true
    location: "Physlib/ClassicalMechanics/Lagrangian/Basic.lean (LagrangianSystem.ofNormedSpace)"

  - description: >
      The API shall derive conservation of momentum and angular momentum from Noether's theorem.
    done: false
    location: N/A
