version: v0.1

Title: FLRW cosmology

Overview: |
    A Friedmann-Lemaître-Robertson-Walker (FLRW) spacetime models a homogeneous
    and isotropic universe. Its geometry is set by a scale factor a(t), a function
    of cosmic time, together with the curvature of the spatial slices, which is
    spherical, flat, or saddle. The expansion rate is the Hubble parameter
    H = (∂ₜ a) / a, and the change of the expansion rate is measured by the
    deceleration parameter q = -(∂ₜ ∂ₜ a) a / (∂ₜ a)^2. The dynamics is governed
    by the Friedmann equations, which relate the scale factor to the energy
    density and pressure of the cosmic fluid, the spatial curvature, and the
    cosmological constant.

    The formal content lives in FLRW/Basic.lean: the spatial geometry with its
    metric profile function S and the flat limits of the spherical and saddle
    cases, the first- and second-order Friedmann equations as propositions on a
    scale factor, the Hubble parameter, and the deceleration parameter with the
    relation ∂ₜ H = -H^2 (1 + q). The same file defines the two structures of
    the API, FLRW (a scale factor positive and twice differentiable on an open
    interval of cosmic time, together with a spatial geometry) and CosmicFluid
    (the energy density and pressure of the cosmic fluid), the density and
    pressure of the cosmological constant as a fluid with the cosmic fluid with
    Λ folded in, the tangent-line bound for a model whose scale factor
    decelerates on its interval, and the proposition
    FLRW.FriedmannSolution that a model filled with a fluid satisfies the two
    Friedmann equations on its interval, the curvature parameter being given by
    the spatial geometry. MatterContent.lean contains the continuity equation of
    the cosmic fluid and its relation to the two Friedmann equations (for a
    solution it is a lemma), the barotropic equation of state with the density
    scaling laws, and the Friedmann equations with Λ as equations without Λ.
    DeSitter.lean contains the de Sitter solution and the de Sitter model, which,
    filled with the empty fluid, solves the Friedmann equations at all times.
    Solutions.lean contains the exact radiation-dominated, Einstein-de Sitter,
    Milne and Einstein static solutions, the Milne model also as an FLRW model
    which, filled with the empty fluid, solves the Friedmann equations after a
    Big Bang. DensityParameters.lean
    contains the critical density and the density parameters with the closure
    relation. ReducedHubble.lean contains
    the reduced Hubble function of the standard cosmological model and the
    equality scale factors. Age.lean contains the age of the universe.
    EnergyConditions.lean contains the energy conditions of the cosmic fluid.
    FriedmannSolution.lean contains, for a solution of the Friedmann equations
    on its interval, the solution with Λ as a solution without Λ, the acceleration
    criterion, the deceleration parameter in terms of the density parameters,
    eternal expansion and the Big-Bang bound on the interval of time. Two further modules, ConformalTime.lean
    and Distances.lean, contain only TODO items: conformal time and the
    conformal Hubble factor, cosmological distances and redshift.
    Cosmology/Basic.lean is a placeholder module doc with no declarations.

ParentAPIs:
  - Time (Physlib/SpaceAndTime/Time)

References:
  - "D. Baumann, Cosmology, Cambridge University Press (2022), Chapter 2 (FLRW geometry, Hubble parameter, Friedmann equations, matter content)"
  - "S. Dodelson and F. Schmidt, Modern Cosmology, 2nd ed., Chapter 2 (the smooth, expanding universe)"
  - "S. Weinberg, Cosmology, Oxford University Press (2008), Chapter 1 (the Robertson-Walker metric, the deceleration parameter, the Friedmann equations)"

Requirements:

  - description: >
      The spatial geometry of the constant-time slices is defined, as an inductive
      type with spherical, flat and saddle constructors, together with the metric
      profile function S giving the transverse radius k sin(r/k), r, or
      k sinh(r/k) in the three cases.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (SpatialGeometry, SpatialGeometry.S)"

  - description: >
      The flat geometry is the large-radius limit of the curved ones: the profile
      S of the spherical and of the saddle geometry tends to the flat profile as
      the curvature radius tends to infinity.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (limit_S_sphere, limit_S_saddle, tendsto_sin_rx_over_x, tendsto_sinh_rx_over_x, mul_sin_as_div, mul_sinh_as_div)"

  - description: >
      The key data structure, an FLRW model given by a scale factor
      a : Time → ℝ, positive and twice differentiable on an open interval of
      cosmic time, together with an element of SpatialGeometry, is defined. The
      spatial geometry gives the curvature parameter of the Friedmann equations,
      positive for the spherical geometry, zero for the flat one and negative for
      the saddle one.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (FLRW, FLRW.a_ne_zero, FLRW.differentiableAt_a, FLRW.differentiableAt_deriv_a, SpatialGeometry.curvature, SpatialGeometry.curvature_flat, SpatialGeometry.curvature_spherical_pos, SpatialGeometry.curvature_saddle_neg)"

  - description: >
      The cosmic fluid, given by its energy density and pressure as functions of
      cosmic time, is defined, together with the empty fluid, and the proposition
      that an FLRW model filled with a cosmic fluid solves the Friedmann equations
      is defined: both Friedmann equations hold on the interval of the model. The
      continuity equation follows from it as a lemma, and so does the closure
      relation of the density parameters. The de Sitter model, at all times, and
      the Milne model, after its Big Bang, filled with the empty fluid, are
      examples.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (CosmicFluid, CosmicFluid.empty, FLRW.FriedmannSolution); Physlib/Cosmology/FLRW/MatterContent.lean (FLRW.FriedmannSolution.continuityEquation); Physlib/Cosmology/FLRW/DensityParameters.lean (FLRW.FriedmannSolution.densityParameter_add_lambda_add_curvature); Physlib/Cosmology/FLRW/DeSitter.lean (FLRW.deSitter, FLRW.friedmannSolution_deSitter); Physlib/Cosmology/FLRW/Solutions.lean (FLRW.milne, FLRW.friedmannSolution_milne)"

  - description: >
      The first-order Friedmann equation
      (∂ₜ a / a)^2 = (8πG/3) ρ - k c^2 / a^2 + Λ c^2 / 3 and the second-order
      Friedmann equation ∂ₜ ∂ₜ a / a = -(4πG/3) (ρ + 3 p / c^2) + Λ c^2 / 3 are
      defined as propositions, the first on a scale factor and an energy density
      with the curvature parameter explicit, the second additionally on a
      pressure and without a curvature term; the cosmological constant, Newton's
      constant and the speed of light are explicit in both.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (FirstOrderFriedmann, SecondOrderFriedmann)"

  - description: >
      The Hubble parameter H = ∂ₜ a / a is defined as a function of the scale
      factor and cosmic time, and is nonzero whenever a and ∂ₜ a are both nonzero
      at the given time.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (hubbleConstant, hubbleConstant_ne_zero)"

  - description: >
      The deceleration parameter q = -(∂ₜ ∂ₜ a) a / (∂ₜ a)^2 is defined, and the
      API contains the quotient-rule formula for ∂ₜ H, the identities
      q = -(1 + (∂ₜ H) / H^2) and ∂ₜ H = -H^2 (1 + q), and the pointwise and
      existential equivalences between ∂ₜ H < 0 and q > -1.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (decelerationParameter, deriv_hubbleConstant, decelerationParameter_eq_one_plus_hubbleConstant, deriv_hubbleConstant_eq_neg_sq_mul, deriv_hubbleConstant_neg_iff, exists_deriv_hubbleConstant_neg_iff)"

  - description: >
      The continuity equation ∂ₜ ρ + 3 H (ρ + P/c^2) = 0 of the cosmic fluid is
      defined as a proposition at an instant, and the API relates it to the two
      Friedmann equations: it follows from the first-order equation holding at all
      times near the instant considered together with the second-order equation,
      and conversely the
      second-order equation follows from the first-order equation and the
      continuity equation wherever ∂ₜ a ≠ 0.
    done: true
    location: "Physlib/Cosmology/FLRW/MatterContent.lean (ContinuityEquation, deriv_firstOrderFriedmann, continuityEquation_of_friedmann, secondOrderFriedmann_of_continuityEquation)"

  - description: >
      The barotropic equation of state P = w ρ c^2 is defined, and the API
      contains the density scaling law ρ t = ρ t₀ (a t / a t₀)^(-3(1+w)) under the
      barotropic continuity equation holding at all times, its converse, and its
      dust, radiation and vacuum-energy special cases.
    done: true
    location: "Physlib/Cosmology/FLRW/MatterContent.lean (barotropicPressure, deriv_of_continuityEquation_barotropic, density_scaling, continuityEquation_of_scaling, density_scaling_dust, density_scaling_radiation, density_scaling_vacuum)"

  - description: >
      The API contains the cosmological constant as a fluid: the density
      ρ_Λ = Λ c^2 / (8πG) and the pressure p_Λ = -ρ_Λ c^2 are defined, each
      Friedmann equation with Λ is equivalent to the same equation without Λ for
      the fluid ρ + ρ_Λ, p + p_Λ, and p_Λ is the w = -1 barotropic pressure of
      ρ_Λ.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (FLRW.FriedmannEquation.cosmologicalConstantDensity, FLRW.FriedmannEquation.cosmologicalConstantPressure, CosmicFluid.addCosmologicalConstant); Physlib/Cosmology/FLRW/MatterContent.lean (firstOrderFriedmann_iff_lambdaFluid, secondOrderFriedmann_iff_lambdaFluid, cosmologicalConstantPressure_eq_barotropic); Physlib/Cosmology/FLRW/FriedmannSolution.lean (FLRW.friedmannSolution_iff_addCosmologicalConstant)"

  - description: >
      The critical density ρ_cr = 3 H^2 / (8πG) and the density parameters Ω = ρ
      / ρ_cr, Ω_K = -k c^2 / (H^2 a^2) and Ω_Λ = Λ c^2 / (3 H^2) are defined,
      and the first-order Friedmann equation is read as the closure relation Ω +
      Ω_Λ + Ω_K = 1.
    done: true
    location: "Physlib/Cosmology/FLRW/DensityParameters.lean (criticalDensity, densityParameter, curvatureDensityParameter, lambdaDensityParameter, densityParameter_add_lambda_add_curvature, densityParameter_add_curvature)"

  - description: >
      The reduced Hubble function E(x)^2 = Ω_Λ + Ω_m x^-3 + Ω_r x^-4 + Ω_K x^-2
      of the standard cosmological model is defined, with H = H₀ E(a / a₀) for
      matter and radiation obeying their scaling laws, the age t₀ = H₀^-1 ∫₀¹ dx
      / (x E(x)) and the radiation-matter and matter-Λ equality scale factors.
    done: true
    location: "Physlib/Cosmology/FLRW/ReducedHubble.lean (reducedHubble, sq_hubbleConstant_eq_reducedHubble, hubbleConstant_eq_reducedHubble, equalityScaleFactorRadiationMatter, equalityScaleFactorMatterLambda); Physlib/Cosmology/FLRW/Age.lean (age, age_eq)"

  - description: >
      The null, weak, strong and dominant energy conditions of the cosmic fluid
      are defined with the implications between them, and the API contains, on
      the interval of a solution of the Friedmann equations, the acceleration
      criterion 0 < ∂ₜ ∂ₜ a ↔ ρ + 3 p / c^2 < 0, without and with Λ, and the
      deceleration parameter in terms of the density parameters, q =
      ½ Σ_i Ω_i (1 + 3 w_i), with its ΛCDM special case.
    done: true
    location: "Physlib/Cosmology/FLRW/EnergyConditions.lean (CosmicFluid.NullEnergyCondition, CosmicFluid.WeakEnergyCondition, CosmicFluid.StrongEnergyCondition, CosmicFluid.DominantEnergyCondition, CosmicFluid.DominantEnergyCondition.weakEnergyCondition, CosmicFluid.WeakEnergyCondition.nullEnergyCondition, CosmicFluid.StrongEnergyCondition.nullEnergyCondition); Physlib/Cosmology/FLRW/FriedmannSolution.lean (FLRW.FriedmannSolution.deriv_deriv_scaleFactor_pos_iff, FLRW.FriedmannSolution.deriv_deriv_scaleFactor_pos_iff_lambda, FLRW.FriedmannSolution.decelerationParameter_eq_sum, FLRW.FriedmannSolution.decelerationParameter_lambdaCDM)"

  - description: >
      The API contains eternal expansion on the interval of a solution, for a
      spatial geometry of non-positive curvature, 0 ≤ Λ and positive density,
      and the Big-Bang bound: an FLRW model that decelerates on its interval and
      expands at t₀ lies below its tangent line at t₀ and cannot be defined
      earlier than t₀ - 1 / H(t₀), so that its interval is bounded below; this
      holds for a solution with 0 ≤ ρ, 0 ≤ p and Λ = 0, whereas the de Sitter
      model is defined at all times.
    done: true
    location: "Physlib/Cosmology/FLRW/Basic.lean (FLRW.mk_mem_I_of_mem_Icc, FLRW.continuousOn_deriv_scaleFactor_mk, FLRW.scaleFactor_le_tangent, FLRW.lt_of_mem_I_of_decelerating, FLRW.bddBelow_I_of_decelerating); Physlib/Cosmology/FLRW/FriedmannSolution.lean (FLRW.FriedmannSolution.deriv_scaleFactor_ne_zero, FLRW.FriedmannSolution.deriv_scaleFactor_pos, FLRW.FriedmannSolution.deriv_deriv_scaleFactor_nonpos, FLRW.FriedmannSolution.lt_of_mem_I, FLRW.FriedmannSolution.bddBelow_I); Physlib/Cosmology/FLRW/DeSitter.lean (FLRW.not_bddBelow_deSitter_I)"
