version: v0.1

Title: "Dirac Fermions"

Overview: |
  A Dirac fermion is the four-component spinor built from a left-handed Weyl
  fermion together with a dual right-handed one. The key data structure is the
  structure `Dirac`, which carries a module structure over ℂ, the chiral basis
  indexed by `Fin 4`, and the representation of SL(2, ℂ) induced from the two
  Weyl factors. Gamma endomorphisms are defined directly in the chiral basis
  and satisfy the Clifford relations with Minkowski signature (+,-,-,-).
  Their chirality operator defines complementary left and right chiral
  projectors. A change of coordinates derives the concrete gamma matrices in
  the Dirac representation from these endomorphisms. They generate the Dirac
  algebra and realize it as a quotient of the Clifford algebra of the Minkowski
  quadratic form. Completing this API allows the
  Dirac equation, the Dirac bilinears, and the fermionic terms of the Standard
  Model Lagrangian to be stated.

ParentAPIs:
  - "Weyl Fermions (Physlib/Relativity/Fermions/Weyl)"
  - "Lorentz Group (Physlib/Relativity/LorentzGroup)"

References:
  - "Dreiner, Haber and Martin, Two-component spinor techniques and Feynman rules for quantum field theory and supersymmetry, Phys. Rept. 494 (2010) 1-196. https://arxiv.org/abs/0812.1594 (Dirac fermions are treated on page 197 of the arXiv version)"

Requirements:

  - description: "The key data structure `Dirac` is defined, as a left-handed Weyl fermion together with a dual right-handed one."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (Dirac)

  - description: "`Dirac` carries a module structure over ℂ, inherited from its two Weyl components."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (AddCommGroup Dirac, Module ℂ Dirac, left_add, dualRight_add, left_smul, dualRight_smul)

  - description: "The decomposition of a Dirac fermion into its Weyl components is an equivalence, linear over ℂ."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (decomposeEquiv, decomposeLinEquiv)

  - description: "The chiral basis of `Dirac` indexed by `Fin 4` is defined, and its elements are identified with the Weyl basis elements."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (chiralBasis, chiralBasis_cast_add, chiralBasis_nat_add)

  - description: "`Dirac` carries a representation of SL(2, ℂ), acting componentwise on the two Weyl factors."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (rep, rep_apply_mk)

  - description: "The representation on `Dirac` is equivalent to the product of the representations on its Weyl components."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (decomposeRepEquiv)

  - description: "The gamma matrices in the Dirac representation are derived from the gamma endomorphisms, together with the chirality matrix and the set they form."
    done: true
    location: Physlib/Relativity/CliffordAlgebra.lean (γ0, γ1, γ2, γ3, γ5, γ5_eq_endEquivMatrix, γSet, γ_in_γSet)

  - description: "The Dirac algebra generated over ℝ by the Dirac representations of the gamma endomorphisms is defined, and contains each generator, indexed by Fin 1 ⊕ Fin 3."
    done: true
    location: Physlib/Relativity/CliffordAlgebra.lean (diracAlgebra, γSet_subset_diracAlgebra, γ_in_diracAlgebra)

  - description: "The Minkowski quadratic form is defined and the induced algebra map from its Clifford algebra onto the Dirac algebra is surjective."
    done: true
    location: Physlib/Relativity/CliffordAlgebra.lean (diracForm, ofCliffordAlgebra, ofCliffordAlgebra_ι_single, ofCliffordAlgebra_range_eq_top, ofCliffordAlgebra_surjective)

  - description: "The API shall contain the isomorphism between the Clifford algebra of `diracForm` and `diracAlgebra` (blocked: needs injectivity of `ofCliffordAlgebra`, which requires dimension theory; recorded as a TODO in the source)."
    done: false
    location: N/A

  - description: "Clifford multiplication is a real linear map from Lorentz vectors to complex linear endomorphisms of `Dirac`, using its chiral basis and Physlib's Pauli-matrix conventions. Upper-index gamma components are derived from this map on the Lorentz basis."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/GammaMatrices.lean (gammaMatrix, gammaMatrix_toMatrix, gammaMatrix_basis_toMatrix, gamma, gammaMatrix_basis, gammaMatrix_eq_sum, gamma_toMatrix)

  - description: "Clifford multiplication satisfies the anticommutator for arbitrary Lorentz vectors and their Minkowski product. The component relations, squares, and anticommutation for distinct indices follow with signature (+,-,-,-)."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/GammaMatrices.lean (gammaMatrix_basis_anticomm, gammaMatrix_anticomm, gammaMatrix_mul_self, gamma_anticomm, gamma_mul_self, gamma_inl_zero_mul_self, gamma_inr_mul_self, gamma_mul_gamma_of_ne)

  - description: "The chirality endomorphism is defined, has chiral matrix diag(-1,-1,1,1), squares to the identity, and anticommutes with every gamma endomorphism."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/GammaMatrices.lean (gamma5, gamma5_toMatrix, gamma5_mul_self, gamma5_mul_gamma, gamma5_mul_gammaMatrix)

  - description: "The left and right chiral projectors have the corresponding diagonal matrices, are idempotent and orthogonal, and sum to the identity."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/GammaMatrices.lean (leftChiralProjector, rightChiralProjector, leftChiralProjector_toMatrix, rightChiralProjector_toMatrix, leftChiralProjector_mul_self, rightChiralProjector_mul_self, leftChiralProjector_mul_rightChiralProjector, rightChiralProjector_mul_leftChiralProjector, leftChiralProjector_add_rightChiralProjector)

  - description: "The API shall contain the Lorentz equivariance of the chiral projectors."
    done: false
    location: N/A

  - description: "An algebra equivalence converts Dirac endomorphisms to the Dirac representation, with an explicit change-of-coordinates formula from the chiral basis."
    done: true
    location: Physlib/Relativity/Fermions/Dirac/Basic.lean (endEquivMatrix, endEquivMatrix_apply)

  - description: "The API shall contain the Dirac adjoint of a Dirac fermion."
    done: false
    location: N/A

  - description: "The API shall contain the Dirac bilinears, and their transformation behaviour under the SL(2, ℂ) action."
    done: false
    location: N/A

  - description: "The API shall contain the Dirac equation for a spinor field on spacetime."
    done: false
    location: N/A

